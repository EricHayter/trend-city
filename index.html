<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TREND CITY</title>
    <style>
      *{margin:0;padding:0;box-sizing:border-box}
      html,body{width:100%;height:100%;overflow:hidden;background:#0a0713;
        font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;
        -webkit-font-smoothing:antialiased;color:#fff;cursor:none}
      #app{position:fixed;inset:0}
      canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
      #gl{z-index:1}
      #ui{z-index:2;pointer-events:none}
      #boot{position:fixed;inset:0;z-index:9;display:grid;place-items:center;
        background:#0a0713;transition:opacity .45s ease;font-size:12px;letter-spacing:.5em}
      #boot.gone{opacity:0;pointer-events:none}
      #boot b{display:block;font-weight:700;font-size:11px;color:#ff2e88;text-align:center}
      #boot i{display:block;font-style:normal;color:#3ad9ff;font-size:9px;margin-top:14px;
        letter-spacing:.35em;text-align:center;opacity:.7}
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <canvas id="ui"></canvas>
    </div>
    <div id="boot"><div><b>TREND CITY</b><i>COMPILING BOROUGH</i></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
