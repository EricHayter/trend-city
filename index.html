<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VOLTBOROUGH</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #07060f; }
  /* No HTML UI ships in the game: every pixel of interface is drawn by the canvas HUD. */
  #stage { position: fixed; inset: 0; }
  #gl, #hud { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { pointer-events: none; }
  #boot { position: absolute; inset: 0; display: grid; place-items: center; background: #07060f;
          font: 700 13px/1.6 ui-monospace, monospace; letter-spacing: .34em; color: #7de8ff; text-transform: uppercase; }
  #boot.gone { opacity: 0; transition: opacity .45s ease; pointer-events: none; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="gl"></canvas>
    <canvas id="hud"></canvas>
    <div id="boot">Compiling borough\u2026</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
